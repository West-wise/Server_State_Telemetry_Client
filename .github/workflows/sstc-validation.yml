name: SSTC Task Validation
run-name: SSTC validation / ${{ inputs.task_id }} / ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: SST-AX Task ID
        required: true
        type: string
      candidate_sha:
        description: SSTC candidate commit SHA (40 lowercase hex characters)
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      task_id: ${{ steps.inputs.outputs.task_id }}
      candidate_sha: ${{ steps.inputs.outputs.candidate_sha }}
    steps:
      - name: Validate dispatch and inputs
        id: inputs
        env:
          TASK_ID: ${{ inputs.task_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          python3 - <<'PY'
          import os
          import re

          task_id = os.environ["TASK_ID"]
          candidate_sha = os.environ["CANDIDATE_SHA"]
          if not re.fullmatch(r"(?:sstd-sync|sstc-feature)-[0-9]{8}-[0-9]{4}", task_id):
              raise SystemExit("Invalid Task ID")
          if not re.fullmatch(r"[0-9a-f]{40}", candidate_sha):
              raise SystemExit("An immutable candidate commit SHA is required")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"task_id={task_id}\ncandidate_sha={candidate_sha}\n")
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false
      - name: Verify checked out commit
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
      - name: Run Build and Tests
        run: ./gradlew testDebugUnitTest assembleDebug

  receipt:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Candidate code and files never run in the receipt job.
      - name: Write validation receipt
        env:
          TASK_ID: ${{ needs.prepare.outputs.task_id }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema_version": "1.0",
              "task_id": os.environ["TASK_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "build_result": os.environ["BUILD_RESULT"],
              "validation": {
                  "jdk": "17",
                  "commands": [
                      "chmod +x gradlew",
                      "./gradlew testDebugUnitTest assembleDebug",
                  ],
              },
              "authorization": "NONE",
          }
          Path("receipt").mkdir()
          Path("receipt/validation.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload validation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sstc-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt/validation.json
          if-no-files-found: error
          retention-days: 14
